---
# Run remaining site roles after Calico is up (nfs, traefik, checks).
- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: nfs_server

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: nfs_csi

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: traefik_gateway

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: sample_app

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: post_install_checks

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: test_nfs_storage
