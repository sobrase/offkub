---
- hosts: all
  become: yes
  any_errors_fatal: true
  roles:
    - role: prepare_system

- hosts: gpu
  become: yes
  any_errors_fatal: true
  roles:
    - role: install_gpu
      when: groups['gpu'] is defined and groups['gpu'] | length > 0

- hosts: all
  become: yes
  any_errors_fatal: true
  roles:
    - role: install_k8s

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: setup_registry

# serial: 1 so control-plane join runs one at a time (etcd allows only one learner at a time)
- hosts: masters
  become: yes
  any_errors_fatal: true
  serial: 1
  roles:
    - role: kubeadm_master

- hosts: workers
  become: yes
  any_errors_fatal: true
  roles:
    - role: kubeadm_workers

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: nfs_server

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: nfs_csi

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: traefik_gateway

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: sample_app

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: post_install_checks

- hosts: masters
  become: yes
  any_errors_fatal: true
  run_once: true
  roles:
    - role: test_nfs_storage

