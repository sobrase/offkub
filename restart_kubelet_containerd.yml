---
# Restart kubelet and containerd on all nodes.
# Skips unreachable hosts so one down node does not fail the run.
# Run: .venv/bin/ansible-playbook -i inventory restart_kubelet_containerd.yml
- hosts: all
  become: true
  ignore_unreachable: true
  tasks:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
