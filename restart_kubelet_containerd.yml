---
# Restart kubelet and containerd on all nodes.
# Run: ansible-playbook -i inventory restart_kubelet_containerd.yml
# Or: .venv/bin/ansible-playbook -i inventory restart_kubelet_containerd.yml
- hosts: all
  become: true
  tasks:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
