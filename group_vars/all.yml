# Global variables for offline Kubernetes deployment

# SSH user (match your ~/.ssh/config User for these hosts)
ansible_user: debian
# Force Ansible to use IPv4 for SSH (avoids freeze when firewall restricts IPv6)
ansible_ssh_common_args: '-o AddressFamily=inet'

# Kubernetes versions (use latest patch from https://kubernetes.io/releases/patch-releases/)
kube_version: "1.32.12"              # Upstream version
kube_version_pkgs: "1.32.12-1.1"     # Package release string; verify with: apt-cache madison kubeadm

# Debian package files required for air‑gapped installation
kubernetes_packages:
  - kubeadm_1.32.12-1.1_amd64.deb
  - kubelet_1.32.12-1.1_amd64.deb
  - kubectl_1.32.12-1.1_amd64.deb
  - kubernetes-cni_1.6.0-1.1_amd64.deb
  - cri-tools_1.32.0-1.1_amd64.deb   # from kubeadm dependency on asset server (pkgs.k8s.io ships 1.32.0 with kubeadm 1.32.12)
  # Debian 13 (trixie) versions; use 1.7.4.4-2 / 1:1.4.7-1+b2 / 2.0.11-5 for Bookworm
  - socat_1.8.0.3-1_amd64.deb
  - conntrack_1:1.4.8-2_amd64.deb
  - ebtables_2.0.11-6_amd64.deb

# Container runtime (used on all nodes)
containerd_version: "1.7.27"
# When set, use this exact .deb filename for containerd (e.g. Debian Trixie: 1.7.29-1~debian.13~trixie)
containerd_pkg_filename: "containerd.io_1.7.29-1~debian.13~trixie_amd64.deb"

# Socket path for the container runtime used during kubeadm join
cri_socket: "/run/containerd/containerd.sock"

# Version of the registry image used for the local Docker registry
registry_version: "2.8.2"

# Docker packages for the local registry host (Debian 13 trixie; use bookworm versions for Debian 12)
registry_docker_packages:
  - docker-ce_5:29.2.1-1~debian.13~trixie_amd64.deb
  - docker-ce-cli_5:29.2.1-1~debian.13~trixie_amd64.deb
  - containerd.io_1.7.29-1~debian.13~trixie_amd64.deb

# Paths used across roles
offline_pkg_dir: "/opt/offline/pkgs"   # Location where .deb files are stored
offline_image_dir: "/opt/offline/images" # Location of saved container images

# Calico configuration
calico_version: "v3.30.2"           # Manifest version
calico_image_version: "v3.30.2"    # Container image tag
tigera_operator_version: "v1.38.3"  # Tigera operator image tag
traefik_version: "3.4.1"          # Traefik image tag
whoami_version: "v1.10.1"          # traefik/whoami image tag used for tests
traefik_chart_version: "36.0.0"    # Helm chart version used for templating
traefik_crds_chart_version: "1.9.0" # traefik-crds chart version
helm_version: "v3.18.4"            # Helm CLI version used when fetching assets

# Use kube-proxy for Service ClusterIP/NodePort (true). Set false to rely on Calico only.
use_kube_proxy: true

# Cluster network CIDRs. Must match kubeadm networking and restrict_access (iptables) so pod/service traffic is allowed.
pod_network_cidr: "10.244.0.0/16"   # podSubnet in kubeadm; restrict_access_pod_network_cidr in firewall
service_network_cidr: "10.96.0.0/12" # serviceSubnet in kubeadm (ClusterIP range)

# Private registry settings
registry_host: "registry.local"
registry_port: 5000
registry: "{{ registry_host }}:{{ registry_port }}"
# Host path for registry data. Daily GC limits bloat; optional: set registry_data_device to a block device to use a separate filesystem.
registry_data_path: "/srv/registry"
# Optional: block device (e.g. /dev/sdb or /dev/sdb1) to mount at registry_data_path so registry cannot fill root. First master only (50G disk).
registry_data_device: "/dev/sdb"
registry_data_fstype: "ext4"
# etcd image in offline registry (may differ from kubeadm default; set to match fetched image)
etcd_image_tag: "3.5.16-0"

# Simple HTTP server settings used to distribute offline assets
asset_server_port: 8081
asset_server_host: "{{ registry_host }}"

# NVIDIA GPU configuration
nvidia_driver_runfile: "NVIDIA-Linux-x86_64-535.129.03.run"
nvidia_toolkit_version: "1.15.0"        # Container toolkit package
device_plugin_version: "v0.15.0"        # NVIDIA device plugin image tag

# CSI and NFS storage components
csi_provisioner_version: "v5.3.0"
csi_resizer_version: "v1.14.0"
csi_snapshotter_version: "v8.3.0"
livenessprobe_version: "v2.16.0"
csi_node_driver_registrar_version: "v2.14.0"
snapshot_controller_version: "v8.3.0"
nfsplugin_image: "{{ registry }}/k8s-staging-sig-storage/nfsplugin:canary"
csi_provisioner_image: "{{ registry }}/sig-storage/csi-provisioner:{{ csi_provisioner_version }}"
csi_resizer_image: "{{ registry }}/sig-storage/csi-resizer:{{ csi_resizer_version }}"
csi_snapshotter_image: "{{ registry }}/sig-storage/csi-snapshotter:{{ csi_snapshotter_version }}"
livenessprobe_image: "{{ registry }}/sig-storage/livenessprobe:{{ livenessprobe_version }}"
csi_node_driver_registrar_image: "{{ registry }}/sig-storage/csi-node-driver-registrar:{{ csi_node_driver_registrar_version }}"
snapshot_controller_image: "{{ registry }}/sig-storage/snapshot-controller:{{ snapshot_controller_version }}"

# List of NVIDIA container toolkit package filenames served by the asset server
nvidia_packages:
  - "nvidia-container-toolkit_{{ nvidia_toolkit_version }}-1_amd64.deb"

# Hosts file configuration
add_registry_host_entry: true            # Whether to map registry_host in /etc/hosts
# Leave empty to use first master IP from inventory; set to override (e.g. floating IP).
registry_master_ip: ""

# Stable endpoint used for joining additional control plane nodes. Uses
# registry_master_ip when set, else first master IP from inventory.
control_plane_endpoint: "{{ ((registry_master_ip | default('')) | trim if (registry_master_ip | default('')) | trim else hostvars[groups['masters'][0]].ansible_default_ipv4.address) }}:6443"

