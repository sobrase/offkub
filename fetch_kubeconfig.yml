---
# Fetch kubeconfig from first master to local ~/.kube/config
# Run: ansible-playbook -i inventory fetch_kubeconfig.yml

- name: Slurp admin kubeconfig from first master
  hosts: "{{ (groups['masters'] | default([]))[0] }}"
  gather_facts: false
  become: true
  tasks:
    - name: Read admin.conf
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: kubeconfig_slurp

    - name: Expose kubeconfig content for local write
      ansible.builtin.set_fact:
        kubeconfig_b64: "{{ kubeconfig_slurp.content }}"
      run_once: true

- name: Write kubeconfig to local ~/.kube/config
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    first_master: "{{ (groups['masters'] | default([]))[0] }}"
  tasks:
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"

    - name: Write kubeconfig
      ansible.builtin.copy:
        content: "{{ hostvars[first_master].kubeconfig_b64 | b64decode }}"
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: "0600"
