# Tigera Operator CRs required for Calico to deploy in calico-system.
# Apply when Installation "default" is missing: kubectl apply -f scripts/apply_calico_installation_cr.yaml
---
apiVersion: operator.tigera.io/v1
kind: APIServer
metadata:
  name: default
spec: {}
---
apiVersion: operator.tigera.io/v1
kind: Goldmane
metadata:
  name: default
---
apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  imagePullSecrets: []
  kubeletVolumePluginPath: /var/lib/kubelet
  kubernetesProvider: ""
  registry: registry.local:5000
---
apiVersion: operator.tigera.io/v1
kind: Whisker
metadata:
  name: default
