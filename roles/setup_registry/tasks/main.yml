---
# Offline setup of a Docker registry on the master node

- name: Ensure directory for Docker packages exists
  file:
    path: /tmp/docker_debs
    state: directory
    mode: '0755'
  become: yes

# Download the Docker engine .deb files from the master HTTP service
- name: Download Docker packages from asset server
  get_url:
    url: "http://{{ asset_server_host }}:{{ asset_server_port }}/pkgs/{{ item }}"
    dest: "/tmp/docker_debs/{{ item }}"
    mode: '0644'
    timeout: 30
  loop: "{{ registry_docker_packages }}"
  become: yes

# Install Docker from local packages
- name: Install Docker packages
  shell: dpkg -i /tmp/docker_debs/*.deb
  become: yes

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
  become: yes

# Configure Docker daemon to use the insecure local registry
- name: Configure Docker daemon for insecure registry
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["{{ registry_host }}:{{ registry_port }}"],
        "allow-nondistributable-artifacts": ["{{ registry_host }}:{{ registry_port }}"]
      }
    mode: '0644'
  notify: Restart docker
  become: yes

- name: Set registry image tar name
  set_fact:
    registry_image_tar: "registry_{{ registry_version }}.tar"

# Load the registry image from local tarball
- name: Download registry image tarball from asset server
  get_url:
    url: "http://{{ asset_server_host }}:{{ asset_server_port }}/images/{{ registry_image_tar }}"
    dest: /tmp/registry.tar
    mode: '0644'
    timeout: 60
  become: yes

- name: Load registry image
  shell: docker load -i /tmp/registry.tar && rm -f /tmp/registry.tar
  become: yes

# Dedicated filesystem for registry data so a full registry does not fill root (SSH stays available)
# Tag registry_apply: run only these tasks when applying registry config/volume/cron (no asset server).
- name: Ensure registry data mount point exists
  file:
    path: "{{ registry_data_path }}"
    state: directory
    mode: '0755'
  become: yes
  tags: [registry_apply]

- name: Format registry data device if raw (no filesystem)
  when: registry_data_device | length > 0
  block:
    - name: Check if registry data device has a filesystem
      command: blkid -o value -s TYPE "{{ registry_data_device }}"
      register: registry_dev_fstype
      changed_when: false
      failed_when: false

    - name: Format registry data device as ext4
      command: "mkfs -t {{ registry_data_fstype }} -F {{ registry_data_device }}"
      when: registry_dev_fstype.stdout | length == 0 or registry_dev_fstype.rc != 0
  become: yes
  tags: [registry_apply]

- name: Mount separate device at registry data path
  when: registry_data_device | length > 0
  block:
    - name: Add registry data device to fstab
      mount:
        path: "{{ registry_data_path }}"
        src: "{{ registry_data_device }}"
        fstype: "{{ registry_data_fstype }}"
        opts: defaults,nofail
        state: mounted
  become: yes
  tags: [registry_apply]

- name: Ensure registry config directory exists
  file:
    path: /etc/docker/registry
    state: directory
    mode: '0755'
  become: yes
  tags: [registry_apply]

- name: Deploy registry config (enables delete for garbage-collect)
  template:
    src: registry_config.yml.j2
    dest: /etc/docker/registry/config.yml
    mode: '0644'
  notify: Restart registry container
  become: yes
  tags: [registry_apply]

- name: Check if registry container exists and has data volume
  shell: |
    if ! docker ps -a --format '{{"{{"}}.Names{{"}}"}}' | grep -qx 'registry'; then
      echo 'absent'
    elif docker inspect registry --format '{{"{{"}}range .Mounts{{"}}"}}{{"{{"}}.Source{{"}}"}} {{"{{"}}end{{"}}"}}' | grep -q '{{ registry_data_path }}'; then
      echo 'ok'
    else
      echo 'recreate'
    fi
  register: registry_container_state
  changed_when: false
  become: yes
  tags: [registry_apply]

- name: Remove registry container (missing data volume, will recreate with volume)
  when: registry_container_state.stdout == 'recreate'
  shell: docker stop registry; docker rm registry
  become: yes
  tags: [registry_apply]

# Bind to 0.0.0.0 so cluster nodes (registry.local → first master IP) can pull images
- name: Create registry container with dedicated data volume and config
  when: registry_container_state.stdout in ['absent', 'recreate']
  shell: |
    docker run -d \
      -p 0.0.0.0:{{ registry_port }}:5000 \
      --restart=always \
      --name registry \
      -v {{ registry_data_path }}:/var/lib/registry \
      -v /etc/docker/registry/config.yml:/etc/docker/registry/config.yml:ro \
      registry:2
  become: yes
  tags: [registry_apply]

- name: Start registry container (already has correct volume)
  when: registry_container_state.stdout == 'ok'
  shell: docker start registry
  become: yes
  tags: [registry_apply]

- name: Install daily cron to garbage-collect unused registry blobs
  copy:
    dest: /etc/cron.d/registry-garbage-collect
    content: |
      # Garbage-collect unused Docker registry blobs (daily at 03:00)
      0 3 * * * root docker exec registry bin/registry garbage-collect /etc/docker/registry/config.yml
    mode: '0644'
  become: yes
  tags: [registry_apply]

# Define lists of images to load into the registry
- name: Define Kubernetes images
  set_fact:
    kube_core_images:
      - "kube-apiserver_v{{ kube_version }}.tar"
      - "kube-controller-manager_v{{ kube_version }}.tar"
      - "kube-scheduler_v{{ kube_version }}.tar"
      - "kube-proxy_v{{ kube_version }}.tar"
      - "etcd_3.5.16-0.tar"
      - "coredns_v1.11.3.tar"
      - "pause_3.10.tar"
    calico_images:
      - "operator_{{ tigera_operator_version }}.tar"
      - "node_{{ calico_image_version }}.tar"
      - "typha_{{ calico_image_version }}.tar"
      - "cni_{{ calico_image_version }}.tar"
      - "apiserver_{{ calico_image_version }}.tar"
      - "kube-controllers_{{ calico_image_version }}.tar"
      - "envoy-gateway_{{ calico_image_version }}.tar"
      - "envoy-proxy_{{ calico_image_version }}.tar"
      - "envoy-ratelimit_{{ calico_image_version }}.tar"
      - "dikastes_{{ calico_image_version }}.tar"
      - "pod2daemon-flexvol_{{ calico_image_version }}.tar"
      - "csi_{{ calico_image_version }}.tar"
      - "node-driver-registrar_{{ calico_image_version }}.tar"
      - "key-cert-provisioner_{{ calico_image_version }}.tar"
      - "goldmane_{{ calico_image_version }}.tar"
      - "whisker_{{ calico_image_version }}.tar"
      - "whisker-backend_{{ calico_image_version }}.tar"
    storage_images:
      - "nfsplugin_canary.tar"
      - "csi-provisioner_{{ csi_provisioner_version }}.tar"
      - "csi-resizer_{{ csi_resizer_version }}.tar"
      - "csi-snapshotter_{{ csi_snapshotter_version }}.tar"
      - "livenessprobe_{{ livenessprobe_version }}.tar"
      - "csi-node-driver-registrar_{{ csi_node_driver_registrar_version }}.tar"
      - "snapshot-controller_{{ snapshot_controller_version }}.tar"
    nvidia_plugin_image: "nvidia-device-plugin_{{ device_plugin_version }}.tar"
    traefik_image: "traefik_v{{ traefik_version }}.tar"
    python_image: "python_3.12-alpine.tar"
    whoami_image: "whoami_{{ whoami_version }}.tar"

# Avoid filling the filesystem: check free space before downloading tarballs to /tmp and pushing to registry.
- name: Check free space before downloading images
  ansible.builtin.shell: |
    reg_avail=$(df -BM "{{ registry_data_path }}" --output=avail 2>/dev/null | tail -1 | tr -d 'M ' || echo 0)
    tmp_avail=$(df -BM /tmp --output=avail 2>/dev/null | tail -1 | tr -d 'M ' || echo 0)
    min={{ registry_min_free_mb | default(1024) }}
    if [ "$reg_avail" -lt "$min" ]; then echo "FAIL: {{ registry_data_path }} has ${reg_avail}MB free, need ${min}MB"; exit 1; fi
    if [ "$tmp_avail" -lt "$min" ]; then echo "FAIL: /tmp has ${tmp_avail}MB free, need ${min}MB"; exit 1; fi
    echo "ok"
  args:
    executable: /bin/bash
  register: space_check
  changed_when: false
  become: yes

- name: Fail if free space too low
  ansible.builtin.fail:
    msg: "{{ space_check.stderr }}"
  when: space_check.rc != 0
  become: yes

# Download Kubernetes core image tarballs
- name: Download Kubernetes core images
  get_url:
    url: "http://{{ asset_server_host }}:{{ asset_server_port }}/images/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0644'
    timeout: 60
  loop: "{{ kube_core_images }}"
  become: yes

# Load Kubernetes core images and push them to the local registry. Remove tarball after each push to avoid filling /tmp.
- name: Load and push Kubernetes core images
  shell: |
    img=$(docker load -i /tmp/{{ item }} | awk '/Loaded image:/ {print $3}')
    name=$(echo "$img" | awk -F/ '{print $NF}')
    docker tag $img {{ registry }}/$name
    docker push {{ registry }}/$name
    rm -f /tmp/{{ item }}
  args:
    executable: /bin/bash
  loop: "{{ kube_core_images }}"
  become: yes

# Download Calico images
- name: Download Calico images
  get_url:
    url: "http://{{ asset_server_host }}:{{ asset_server_port }}/images/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0644'
    timeout: 60
  loop: "{{ calico_images }}"
  become: yes

# Load Calico networking images and push to the registry
- name: Load and push Calico images
  shell: |
    img=$(docker load -i /tmp/{{ item }} | awk '/Loaded image:/ {print $3}')
    # Preserve repository path but strip any registry domain
    name="$img"
    if [[ "$name" == */* ]]; then
      first="${name%%/*}"
      if [[ "$first" == *.* || "$first" == *:* ]]; then
        name="${name#*/}"
      fi
    fi
    docker tag "$img" {{ registry }}/$name
    docker push {{ registry }}/$name
    rm -f /tmp/{{ item }}
  args:
    executable: /bin/bash
  loop: "{{ calico_images }}"
  become: yes

# Download NVIDIA device plugin image
- name: Download NVIDIA device plugin image
  get_url:
    url: "http://{{ asset_server_host }}:{{ asset_server_port }}/images/{{ nvidia_plugin_image }}"
    dest: "/tmp/{{ nvidia_plugin_image }}"
    mode: '0644'
    timeout: 60
  become: yes

# Load NVIDIA device plugin image and push
- name: Load and push NVIDIA device plugin image
  shell: |
    img=$(docker load -i /tmp/{{ nvidia_plugin_image }} | awk '/Loaded image:/ {print $3}')
    # Preserve the repository path so the image is available as
    # <registry_host>:<registry_port>/nvidia/k8s-device-plugin:<tag>
    name=$(echo "$img" | cut -d/ -f2-)
    docker tag $img {{ registry }}/$name
    docker push {{ registry }}/$name
    rm -f /tmp/{{ nvidia_plugin_image }}
  args:
    executable: /bin/bash
  become: yes

