---
# Default variables for the prepare_system role
swap_fstab_path: "/etc/fstab"          # Path to the fstab file for swap configuration
allow_reboot: false                     # Whether this role may reboot the host automatically

# Whether to add the registry host entry to /etc/hosts (true so first deploy has registry on all nodes)
add_registry_host_entry: true
# IP address to map to registry_host; empty uses first master IP
registry_master_ip: ""

# Placeholder variable - this role currently has no critical defaults
prepare_system_placeholder: true

# Disable NIC offloading on VPS (avoids networking issues between pods/services).
# When true, disables rx/tx checksumming, tso, gso, gro, sg on the default IPv4 interface.
disable_nic_offload: true
# Override interfaces to configure (e.g. ["eth0"]). Empty = use ansible_default_ipv4.interface.
nic_offload_interfaces: []
