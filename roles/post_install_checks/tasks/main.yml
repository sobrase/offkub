---
# Finalize the cluster setup and perform post installation checks

- name: Set kubectl environment
  set_fact:
    kubectl_env:
      KUBECONFIG: /etc/kubernetes/admin.conf
  become: true

# Use kube-proxy for Service ClusterIP/NodePort (default: true). Set use_kube_proxy: false to disable.
# Use JSON replace so we remove non-calico selector; fallback to add if nodeSelector missing (fresh cluster).
- name: Enable kube-proxy (schedule on all nodes)
  block:
    - name: Set kube-proxy nodeSelector to kubernetes.io/os=linux (replace)
      shell: |
        kubectl patch ds kube-proxy -n kube-system --type=json -p '[{"op": "replace", "path": "/spec/template/spec/nodeSelector", "value": {"kubernetes.io/os": "linux"}}]'
      environment: "{{ kubectl_env }}"
      register: kube_proxy_patch
      become: true
  rescue:
    - name: Set kube-proxy nodeSelector (add if path missing)
      shell: |
        kubectl patch ds kube-proxy -n kube-system --type=json -p '[{"op": "add", "path": "/spec/template/spec/nodeSelector", "value": {"kubernetes.io/os": "linux"}}]'
      environment: "{{ kubectl_env }}"
      become: true
  when: use_kube_proxy | default(true) | bool

- name: Disable kube-proxy (schedule on no node)
  shell: kubectl patch ds -n kube-system kube-proxy -p '{"spec":{"template":{"spec":{"nodeSelector":{"non-calico":"true"}}}}}'
  environment: "{{ kubectl_env }}"
  become: true
  when: not (use_kube_proxy | default(true) | bool)

- name: Set Calico API endpoints
  shell: |
    cat <<EOF2 | kubectl apply -f -
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kubernetes-services-endpoint
      namespace: kube-system
    data:
      KUBERNETES_SERVICE_HOST: "{{ hostvars[groups['masters'][0]].ansible_default_ipv4.address }}"
      KUBERNETES_SERVICE_PORT: "6443"
    EOF2
  environment: "{{ kubectl_env }}"
  become: true

# Restart Calico so it picks up API endpoint (kube-system if legacy, calico-system if Tigera operator).
- name: Restart Calico pods in kube-system (legacy) to pick up API endpoint
  shell: kubectl delete pods -n kube-system -l k8s-app=calico-node --ignore-not-found=true
  environment: "{{ kubectl_env }}"
  become: true

# eBPF disabled: connect-time load balancer BPF often fails on VPS kernels (Invalid argument).
# Re-enable with bpfEnabled: true if your kernel supports it (e.g. recent generic kernel).
- name: Set Calico Felix to iptables (eBPF disabled for VPS kernel compatibility)
  shell: |
    kubectl patch felixconfigurations default --type merge -p '{"spec": {"bpfEnabled": false}}'
  environment: "{{ kubectl_env }}"
  become: true
  register: felix_patch
  retries: 4
  delay: 5
  until: felix_patch.rc == 0
  ignore_errors: true

- name: Retry Felix patch (API may be briefly unavailable after Calico restart)
  shell: |
    kubectl patch felixconfigurations default --type merge -p '{"spec": {"bpfEnabled": false}}'
  environment: "{{ kubectl_env }}"
  become: true
  when: felix_patch is failed
  register: felix_retry
  retries: 2
  delay: 5
  until: felix_retry.rc == 0
  ignore_errors: true

# Tigera operator installs calico-node DaemonSet in calico-system; restart it to apply Felix and API endpoint.
- name: Rollout restart Calico node DaemonSet in calico-system
  shell: kubectl rollout restart daemonset calico-node -n calico-system
  environment: "{{ kubectl_env }}"
  become: true
  ignore_errors: true

- name: Brief pause for Calico to start rolling
  pause:
    seconds: 10

- name: Wait for all nodes to be Ready
  shell: |
    not_ready=$(kubectl get nodes --no-headers 2>/dev/null | grep -v " Ready " | wc -l)
    [ "$(echo "$not_ready" | tr -d ' ')" -eq 0 ]
  register: nodes_ready
  retries: 18
  delay: 5
  until: nodes_ready.rc == 0
  environment: "{{ kubectl_env }}"
  changed_when: false
  become: true

- name: Copy NVIDIA device plugin manifest
  template:
    src: nvidia-device-plugin.yml.j2
    dest: /tmp/nvidia-device-plugin.yml
    mode: '0644'
  become: true
  when: groups['gpu'] is defined and groups['gpu'] | length > 0

- name: Apply NVIDIA device plugin manifest
  shell: kubectl apply -f /tmp/nvidia-device-plugin.yml
  environment: "{{ kubectl_env }}"
  become: true
  when: groups['gpu'] is defined and groups['gpu'] | length > 0

- name: Wait for NVIDIA device plugin rollout
  shell: kubectl rollout status ds/nvidia-device-plugin-daemonset -n kube-system --timeout=60s
  register: nvidia_rollout
  retries: 5
  delay: 15
  until: nvidia_rollout.rc == 0
  environment: "{{ kubectl_env }}"
  changed_when: false
  become: true
  when: groups['gpu'] is defined and groups['gpu'] | length > 0

- name: Get node status
  shell: kubectl get nodes -o wide
  register: nodes_output
  changed_when: false
  environment: "{{ kubectl_env }}"
  become: true

- name: Display node status
  debug:
    msg: "{{ nodes_output.stdout }}"
  become: true

- name: Get pod status
  shell: kubectl get pods -A
  register: pods_output
  changed_when: false
  environment: "{{ kubectl_env }}"
  become: true

- name: Display pod status
  debug:
    msg: "{{ pods_output.stdout }}"
  become: true

- name: Cluster installation successful
  debug:
    msg: "Kubernetes cluster is operational (all nodes Ready)"
  become: true
