# Firewall: SSH (restrict_access_ssh_port) is open to anyone. All other ports are whitelist-only.
# Edit this file, then run: ansible-playbook -i inventory restrict_access.yml
#
# Get your IP: curl -s ifconfig.me

# Set to true to enable the firewall on all nodes.
restrict_access_enabled: true

# Port SSH – ouvert à tous (sans whitelist). Mettez le même port que dans ~/.ssh/config si différent de 22.
restrict_access_ssh_port: 22

# Désactiver le trafic IPv6 entrant (drop tout IPv6 sauf établi/loopback).
restrict_access_disable_ipv6: true

# Your IP(s) in CIDR notation – allowed to reach any port (except SSH which is open to all).
# Get your current IP: curl -4 -s ifconfig.me   (use -4 for IPv4; firewall allows IPv4 only)
allowed_source_ips:
  - "90.107.252.190/32"
  - "88.166.14.13/32"
  - "130.180.218.58/32"
  - "92.184.96.103/32"
# Set to true to log dropped packets (kernel log). Use for debugging.
# View: sudo journalctl -k -g "ipt-drop" -f   or   dmesg -w | grep ipt-drop
restrict_access_log_drops: true
